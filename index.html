<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Food Delivery</title>
</head>
<body>
    <main class="hero">
        <header class="navbar">
            <a href="#" class="navbar__logo">
                <img src="photo_navbar\6590dba8e88214e6f6ac128b1c49aa4969da3f24.png" alt="logo_img" class="navbar__logo__img">
                <span class="navbar__logo__text">Foo</span>
            </a>

            <nav class="navbar__menu">
                <ul class="navbar__list">
                    <li class="navbar__item"><a href="#" class="navbar__link">Home</a></li>
                    <li class="navbar__item"><a href="#" class="navbar__link">Menu</a></li>
                    <li class="navbar__item"><a href="#" class="navbar__link">Shop</a></li>
                    <li class="navbar__item"><a href="#" class="navbar__link">Contact</a></li>
                </ul>
            </nav>

            <div class="navbar__actions">
                <div class="navbar__search-wrapper">
                    <img src="photo_navbar/search-icon.svg" alt="Поиск" class="navbar__search-icon">
                
                    <input type="text" class="navbar__search-input" placeholder="Search">
                    
                    <span class="navbar__divider"></span>

                    <a href="#" class="navbar__cart">
                        <img src="photo_navbar/Shopping cart.svg" alt="Корзина" class="navbar__cart-icon">
                        <span class="navbar__cart-count">3</span>
                    </a>
                </div>
            </div>
        </header>

        <section class="hero__content">

            <div class="hero__info">
                <h1 class="hero__title">
                    <span class="hero__title-orange">Fast</span>
                    <div class="hero__title-stack">
                        <span>Food</span>
                        <span>Delivery</span>
                    </div>
                </h1>
                
                <p class="hero__text">
                    Sed ut perspiciatis unde omnis iste natus sit 
                    voluptatem accusantium doloremque laudantium
                </p>
            
                <div class="hero__actions">
                    <button class="hero__order-btn">Order Now</button>

                    <a href="#" class="hero__video-link">
                        <span class="hero__video-icon">▶</span> Watch Video
                    </a>
                </div>
                
                <div class="hero__rating">
                    <div class="hero__stars">★★★★★</div>
    
                    <div class="hero__rating-text">
                        <span class="hero__rating-title">5 star rating</span>
                        <span class="hero__rating-count">based on 1788 reviews</span>
                    </div>
                </div>

            </div>
            
            <div class="hero__image">
                <img src="photo_hero/right-photo-main-content.png" alt="Fast Food" class="hero__main-img">
            </div>

        </section>


    </main>
</body>
</html>
